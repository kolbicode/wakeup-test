<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Wake-Up Reaction Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single game column — progress bar, one card per stage, the pad as the arena. */
:root {
  --bg: #E9EEF5;
  --surface: #FFFFFF;
  --sunk: #F2F5F9;
  --line: #D3DBE5;
  --fg: #14202E;
  --muted: #5A6878;
  --accent: #3B5BDB;
  --accent-2: #F59F00;
  --accent-fg: #FFFFFF;
  --wait: #D62F2F;
  --go: #1F9D55;
  --pad-idle: #1A2433;
  --pad-fg: #FFFFFF;
  --warn: #C92A2A;
  --ok: #2B8A3E;
  --shadow: 0 4px 0 #C5CFDB;
  --font-display: "Fredoka", "Trebuchet MS", Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1420; --surface: #172131; --sunk: #111A27; --line: #2A3850; --fg: #EAF0F7; --muted: #9DAEC2;
    --accent: #8EA6FF; --accent-2: #FFC24B; --accent-fg: #0B1426; --wait: #C73535; --go: #23A35E;
    --pad-idle: #0A0F18; --pad-fg: #FFFFFF; --warn: #FF8787; --ok: #69DB7C; --shadow: 0 4px 0 #0A1019; color-scheme: dark;
  }
}
:root.morning:not([data-theme="light"]), :root[data-theme="dark"] {
  --bg: #0D1420; --surface: #172131; --sunk: #111A27; --line: #2A3850; --fg: #EAF0F7; --muted: #9DAEC2;
  --accent: #8EA6FF; --accent-2: #FFC24B; --accent-fg: #0B1426; --wait: #C73535; --go: #23A35E;
  --pad-idle: #0A0F18; --pad-fg: #FFFFFF; --warn: #FF8787; --ok: #69DB7C; --shadow: 0 4px 0 #0A1019; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
}
.wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; width: 100%; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; font-weight: 600; }
h1 { font-size: 28px; }
h2 { font-size: 21px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--go); display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }
.brand .logo svg { width: 24px; height: 24px; }
.brand b { font-family: var(--font-display); font-size: 21px; font-weight: 700; display: block; line-height: 1.1; }
.brand span { color: var(--muted); font-size: 13px; }
.top-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { font: 600 13px/1 var(--font-display); letter-spacing: 0.04em; padding: 7px 10px; border: none; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"], .seg button[aria-current="true"] { background: var(--fg); color: var(--bg); }

.progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.progress i { height: 8px; border-radius: 99px; background: var(--line); transition: background .3s; }
.progress i.done { background: var(--go); }
.progress i.on { background: var(--accent); }
.progress-label { display: flex; justify-content: space-between; font: 600 13px var(--font-display); color: var(--muted); letter-spacing: 0.03em; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hud div { background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hud b { font: 700 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.hud span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 700; min-width: 0; }
.field small { font-weight: 400; color: var(--muted); }
.field.missing .wheel, .field.missing .slider { outline: 2px solid var(--warn); outline-offset: 3px; border-radius: 14px; }
input, select {
  font: inherit; font-weight: 400; color: var(--fg); background: var(--sunk); border: 1px solid var(--line);
  border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0;
}
input:focus-visible, select:focus-visible, button:focus-visible, .pad:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.idbox { font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

.btn { font: 600 18px/1 var(--font-display); letter-spacing: 0.01em; border: none; border-radius: 14px; padding: 15px 22px; cursor: pointer; background: var(--accent); color: var(--accent-fg); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn.go { background: var(--go); color: #FFFFFF; box-shadow: 0 4px 0 color-mix(in srgb, var(--go) 60%, #000); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); box-shadow: none; font-weight: 500; }
.btn.small { font-size: 15px; padding: 9px 14px; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.btn.wide { width: 100%; }
.err { color: var(--warn); font-size: 14px; }
.note { font-size: 14px; color: var(--muted); background: var(--sunk); border-radius: 12px; padding: 10px 12px; }

/* time picker wheels */
.wheel { position: relative; display: flex; align-items: center; gap: 2px; background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; padding: 0 10px; height: 134px; width: fit-content; max-width: 100%; }
.wheel .band { position: absolute; left: 6px; right: 6px; top: 50%; height: 44px; transform: translateY(-50%); border-radius: 10px; background: var(--surface); border: 1px solid var(--line); pointer-events: none; }
.wcol { position: relative; height: 132px; width: 62px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); border-radius: 10px; touch-action: pan-y; }
.wcol::-webkit-scrollbar { display: none; }
.wcol:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.wcol .sp { height: 44px; }
.wcol .it { height: 44px; line-height: 44px; text-align: center; scroll-snap-align: center; font: 600 24px var(--font-display); font-variant-numeric: tabular-nums; cursor: pointer; user-select: none; -webkit-user-select: none; }
.wcol .it.unset { color: var(--muted); }
.wheel .wsep { position: relative; font: 700 24px var(--font-display); }
.wheel .unit { position: relative; font-size: 13px; color: var(--muted); min-width: 2.4em; }

/* arena */
.pad {
  position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  background: var(--pad-idle); color: var(--pad-fg); border-radius: 22px; min-height: 360px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px 18px; cursor: pointer;
  transition: background-color .06s linear;
}
.pad .big { font: 700 68px/1 var(--font-display); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
.pad .msg { font-size: 17px; position: relative; z-index: 1; max-width: 34ch; }
.pad .fact { font-size: 15px; opacity: 0.85; position: relative; z-index: 1; max-width: 36ch; min-height: 1.5em; }
.pad .ring { position: absolute; width: 180px; height: 180px; border-radius: 50%; border: 3px solid currentColor; opacity: 0; }
.pad.idle .ring { animation: ring 2.2s ease-out infinite; }
.pad.wait { background: var(--wait); }
.pad.go { background: var(--go); }
.pad.go .big { animation: pop .18s ease-out; }
.pad.feedback .big { animation: pop .25s ease-out; }
.pad.early { background: var(--pad-idle); }
.pad.early .big { color: var(--warn); font-size: 44px; animation: shake .35s; }
.pad .count { position: absolute; top: 14px; left: 16px; font: 600 14px var(--font-display); opacity: 0.8; z-index: 1; }
.pad .best { position: absolute; top: 14px; right: 16px; font: 600 14px var(--font-display); opacity: 0.8; z-index: 1; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; position: relative; z-index: 1; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: currentColor; opacity: 0.25; }
.dots i.d { opacity: 1; background: var(--accent-2); animation: pop .3s ease-out; }
.dots i.x { opacity: 1; background: var(--warn); }
@keyframes ring { 0% { transform: scale(.6); opacity: .5; } 100% { transform: scale(1.5); opacity: 0; } }
@keyframes pop { 0% { transform: scale(.7); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

/* rank card */
.rank { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; background: var(--sunk); border: 2px solid var(--accent-2); border-radius: 18px; padding: 16px; animation: rise .4s ease-out; }
.rank .emoji { font-size: 56px; line-height: 1; }
.rank .kicker { font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.rank h2 { font-size: 26px; }
.rank p { color: var(--muted); font-size: 15px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font: 600 14px var(--font-display); background: var(--accent-2); color: #1A1200; border-radius: 999px; padding: 4px 10px; width: fit-content; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stats div { background: var(--sunk); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.stats dd { margin: 0; font: 600 20px var(--font-display); font-variant-numeric: tabular-nums; }
.stats dd small { font-size: 13px; color: var(--muted); font-weight: 400; }

/* chart */
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; min-width: 300px; }
.ch-bar { fill: var(--accent); }
.ch-bar.lapse { fill: var(--warn); }
.ch-zone { fill: var(--warn); opacity: 0.09; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-med { stroke: var(--accent-2); stroke-width: 2.5; stroke-dasharray: 6 5; }
.ch-txt { fill: var(--muted); font: 12px var(--font-body); }
.ch-val { fill: var(--fg); font: 600 12px var(--font-display); }
.ch-medtxt { fill: var(--fg); font: 600 12px var(--font-display); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }

.slider { display: flex; align-items: center; gap: 12px; }
.slider input[type="range"] { flex: 1; padding: 0; border: none; background: transparent; accent-color: var(--accent); height: 34px; }
.slider output { font: 700 26px var(--font-display); min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
.slider.unset output { color: var(--muted); }
.slider.unset input[type="range"] { opacity: 0.55; }


.pad .stopbtn { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); z-index: 2; font: 600 14px var(--font-display); color: inherit; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.pad .count { top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); }
@media (max-width: 760px), (pointer: coarse) {
  .pad.full { position: fixed; inset: 0; z-index: 30; border-radius: 0; min-height: 0; }
}
.pad.count-down .big { font-size: 110px; animation: pop .35s ease-out; }
.check { display: flex; gap: 12px; align-items: flex-start; background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; }
.check input { width: 24px; height: 24px; flex: none; margin: 2px 0 0; accent-color: var(--wait); padding: 0; }
.check b { display: block; font-size: 16px; }
.check span { font-size: 14px; color: var(--muted); }
.check:has(input:checked) { border-color: var(--wait); }
.warnbox { border: 2px solid var(--accent-2); background: var(--sunk); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.warnbox ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: 0.6; } }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: var(--sunk); }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
td a { color: var(--accent); }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.statusline { font-size: 14px; }
.statusline.ok { color: var(--ok); }
.statusline.bad { color: var(--warn); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .confetti { display: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></div>
      <div><b>Wake-Up Reaction Test</b><span data-t="brandSub"></span></div>
    </div>
    <div class="top-right">
      <div class="seg" id="langs" role="group" aria-label="Language"></div>
    </div>
  </header>

  <div id="view-test" class="wrap">
    <div>
      <div class="progress" aria-hidden="true"><i id="pg1"></i><i id="pg2"></i><i id="pg3"></i><i id="pg4"></i></div>
      <div class="progress-label" style="margin-top:6px"><span id="pg-label"></span><span id="pg-num"></span></div>
    </div>

    <!-- STEP 1 -->
    <section class="card" id="s1">
      <h1 data-t="s1Title"></h1>
      <p class="muted" data-t="s1Intro"></p>
      <div class="grid2">
        <label class="field" for="p-id"><span data-t="idLabel"></span><small data-t="idHelp"></small><input id="p-id" class="idbox" maxlength="12" autocomplete="off" spellcheck="false"></label>
        <label class="field" for="p-age"><span data-t="ageLabel"></span><small data-t="ageHelp"></small><input id="p-age" type="number" inputmode="numeric" min="16" max="99"></label>
      </div>
      <p class="err" id="s1-err" hidden></p>
      <button class="btn go wide" type="button" id="to-test" data-t="startTest"></button>
    </section>

    <!-- STEP 2 -->
    <section class="card" id="s2" hidden>
      <div id="test-intro" class="wrap" style="gap:8px">
        <h1 data-t="s2Title"></h1>
        <p class="muted" data-t-html="s2Intro"></p>
      </div>
      <div class="pad idle" id="pad" role="button" tabindex="0" aria-live="polite">
        <span class="ring" aria-hidden="true"></span>
        <span class="count" id="pad-count"></span>
        <button class="stopbtn" type="button" id="pad-stop" data-t="stop" hidden></button>
        <span class="big" id="pad-big">READY?</span>
        <span class="msg" id="pad-msg"></span>
        <span class="dots" id="pad-dots"></span>
      </div>
      <div id="test-result" hidden class="wrap" style="gap:16px">
        <div class="row" style="justify-content:space-between">
          <h2 data-t="resultsTitle"></h2>
          <span class="badge" id="pb-badge" hidden></span>
        </div>
        <div class="chart" id="chart"></div>
        <div class="legend"><span><i style="background:var(--accent)"></i><span data-t="lgReaction"></span></span><span><i style="background:var(--accent-2);height:3px"></i><span data-t="lgMedian"></span></span><span><i style="background:var(--warn);opacity:.35"></i><span data-t="lgLapse"></span></span></div>
        <dl class="stats" id="stats"></dl>
        <label class="check" for="disturbed">
          <input type="checkbox" id="disturbed">
          <div><b data-t="disturbedLabel"></b><span data-t="disturbedHelp"></span></div>
        </label>
        <div class="row end">
          <button class="btn ghost" type="button" id="redo" data-t="redo"></button>
          <button class="btn" type="button" id="to-after" data-t="cont"></button>
        </div>
      </div>
    </section>

    <!-- STEP 3 -->
    <section class="card" id="s3" hidden>
      <h1 data-t="s3Title"></h1>
      <p class="note" data-t="s3Note"></p>
      <div class="field">
        <label for="sl-score" data-t="scoreLabel"></label><small data-t="scoreHelp"></small>
        <div class="slider unset" id="score-wrap"><input id="sl-score" type="range" min="0" max="100" step="1" value="50"><output id="score-out" for="sl-score">–</output></div>
      </div>
      <div class="grid2">
        <div class="field" role="group" aria-labelledby="lbl-total"><span id="lbl-total" data-t="totalLabel"></span><div class="tp" id="tp-total"></div></div>
        <div class="field" role="group" aria-labelledby="lbl-bed"><span id="lbl-bed" data-t="bedLabel"></span><div class="tp" id="tp-bed"></div></div>
        <div class="field" role="group" aria-labelledby="lbl-wake"><span id="lbl-wake" data-t="wakeLabel"></span><div class="tp" id="tp-wake"></div></div>
      </div>
      <div class="wrap" style="gap:10px">
        <h2 data-t="stagesTitle"></h2>
        <div class="grid2">
          <div class="field" role="group" aria-labelledby="lbl-deep"><span id="lbl-deep" data-t="deepLabel"></span><div class="tp" id="tp-deep"></div></div>
          <div class="field" role="group" aria-labelledby="lbl-light"><span id="lbl-light" data-t="lightLabel"></span><div class="tp" id="tp-light"></div></div>
          <div class="field" role="group" aria-labelledby="lbl-rem"><span id="lbl-rem" data-t="remLabel"></span><div class="tp" id="tp-rem"></div></div>
          <div class="field" role="group" aria-labelledby="lbl-awake"><span id="lbl-awake" data-t="awakeLabel"></span><div class="tp" id="tp-awake"></div></div>
        </div>
      </div>
      <div class="warnbox" id="warnbox" hidden role="alert">
        <b data-t="warnTitle"></b>
        <ul id="warnlist"></ul>
        <div class="row end">
          <button class="btn ghost small" type="button" id="warn-fix" data-t="fixBtn"></button>
          <button class="btn small" type="button" id="warn-save" data-t="saveAnyway"></button>
        </div>
      </div>
      <p class="err" id="s3-err" hidden></p>
      <button class="btn go wide" type="button" id="submit" data-t="save"></button>
    </section>

    <!-- STEP 4 -->
    <section class="card" id="s4" hidden>
      <h1 id="done-title"></h1>
      <p class="muted" id="done-text"></p>
      <div id="hist-wrap" class="wrap" style="gap:10px" hidden>
        <h2 data-t="histTitle"></h2>
        <div class="chart" id="hist-chart"></div>
      </div>
      <div class="row" id="fallback" hidden>
        <button class="btn" type="button" id="dl-json" data-t="download"></button>
        <button class="btn ghost" type="button" id="copy-json" data-t="copy"></button>
      </div>
      <p class="statusline" id="fallback-status"></p>

    pad.hidden = true;
    renderResult();
    $("test-result").hidden = false;
    window.scrollTo(0, 0);
    if (T.isPb) confetti();
  }
  $("redo").addEventListener("click", resetTest);
  $("to-after").addEventListener("click", () => {
    if (!tpGet("wake")) {
      const d = new Date((T.startedAt || new Date()).getTime() - 10 * 60000);
      tpSet("wake", d.getHours(), d.getMinutes());
    }
    setStep(3);
  });

  // ---------- alarm-style time pickers ----------
  const ITEM = 44;
  const pickers = {};
  function buildPicker(key, maxHour, isDuration) {
    const box = $("tp-" + key);
    box.className = "wheel"; box.innerHTML = "";
    const band = document.createElement("div"); band.className = "band"; box.appendChild(band);
    const pk = { key, box, h: null, m: null, cols: {}, lock: false, lockT: null };
    const mkCol = (part, max, pad) => {
      const col = document.createElement("div");
      col.className = "wcol"; col.dataset.part = part; col.tabIndex = 0;
      col.setAttribute("role", "spinbutton");
      col.setAttribute("aria-valuemin", "0"); col.setAttribute("aria-valuemax", String(max));
      const sp = () => { const d = document.createElement("div"); d.className = "sp"; d.setAttribute("aria-hidden", "true"); return d; };
      col.appendChild(sp());
      for (let v = -1; v <= max; v++) {
        const it = document.createElement("div");
        it.className = "it" + (v < 0 ? " unset" : "");
        it.textContent = v < 0 ? "––" : (pad ? String(v).padStart(2, "0") : String(v));
        it.setAttribute("aria-hidden", "true");
        it.addEventListener("click", () => setPart(pk, part, v < 0 ? null : v, true));
        col.appendChild(it);
      }
      col.appendChild(sp());
      let tmr = null;
      col.addEventListener("scroll", () => {
        if (pk.lock) return;
        clearTimeout(tmr);
        tmr = setTimeout(() => {
          const idx = Math.max(0, Math.min(max + 1, Math.round(col.scrollTop / ITEM)));
          const v = idx === 0 ? null : idx - 1;
          if (v !== pk[part]) setPart(pk, part, v, false);
        }, 120);
      }, { passive: true });
      col.addEventListener("keydown", (e) => {
        const cur = pk[part]; let next;
        if (e.key === "ArrowUp") next = cur == null || cur === 0 ? null : cur - 1;
        else if (e.key === "ArrowDown") next = cur == null ? 0 : Math.min(max, cur + 1);
        else if (e.key === "Delete" || e.key === "Backspace") next = null;
        else return;
        e.preventDefault(); setPart(pk, part, next, true);
      });
      pk.cols[part] = col;
      return col;
    };
    const unit = (cls) => { const u = document.createElement("span"); u.className = "unit " + cls; return u; };
    if (isDuration) {
      box.append(mkCol("h", maxHour, false), unit("unit-h"), mkCol("m", 59, true), unit("unit-m"));
    } else {
      const sep = document.createElement("span"); sep.className = "wsep"; sep.textContent = ":"; sep.setAttribute("aria-hidden", "true");
      box.append(mkCol("h", maxHour, true), sep, mkCol("m", 59, true));
    }
    pickers[key] = pk;
    syncPicker(pk, null, true);
  }
  function setPart(pk, part, v, scrollSelf) {
    pk[part] = v;
    const other = part === "h" ? "m" : "h";
    if (v == null) pk[other] = null;
    else if (pk[other] == null) pk[other] = 0;
    syncPicker(pk, scrollSelf ? null : part, false);
    pk.box.dispatchEvent(new Event("change", { bubbles: true }));
  }
  function syncPicker(pk, skipPart, instant) {
    for (const part of ["h", "m"]) {
      const col = pk.cols[part], v = pk[part];
      col.setAttribute("aria-valuetext", v == null ? "–" : String(v));
      if (v == null) col.removeAttribute("aria-valuenow"); else col.setAttribute("aria-valuenow", String(v));
      if (part === skipPart) continue;
      const target = (v == null ? 0 : v + 1) * ITEM;
      if (Math.abs(col.scrollTop - target) > 1) {
        pk.lock = true;
        col.scrollTo({ top: target, behavior: instant || reduceMotion ? "auto" : "smooth" });
        clearTimeout(pk.lockT);
        pk.lockT = setTimeout(() => { pk.lock = false; }, instant ? 60 : 450);
      }
    }
  }
  function tpGet(key) { const pk = pickers[key]; return pk.h == null || pk.m == null ? null : { h: pk.h, m: pk.m }; }
  function tpSet(key, h, m) { const pk = pickers[key]; pk.h = h; pk.m = m; syncPicker(pk, null, true); }
  function tpClear(key) { const pk = pickers[key]; pk.h = null; pk.m = null; syncPicker(pk, null, true); }
  buildPicker("bed", 23, false);
  buildPicker("wake", 23, false);
  buildPicker("total", 14, true);
  buildPicker("deep", 8, true);
  buildPicker("rem", 8, true);
  buildPicker("light", 12, true);
  buildPicker("awake", 6, true);
  const durMin = (key) => { const v = tpGet(key); return v ? v.h * 60 + v.m : null; };
  const hhmm = (v) => v ? String(v.h).padStart(2, "0") + ":" + String(v.m).padStart(2, "0") : null;

  // ---------- step 3 ----------
  let scoreSet = false;
  function updateScore() {
    $("score-out").textContent = scoreSet ? $("sl-score").value : "–";
    $("score-wrap").classList.toggle("unset", !scoreSet);
  }
  $("sl-score").addEventListener("input", () => { scoreSet = true; updateScore(); });
  const num = (id) => { const v = $(id).value.trim(); if (v === "") return null; const n = Number(v); return Number.isFinite(n) ? n : null; };


  function minutesSince(v, date) {
    if (!v) return null;
    const w = new Date(date); w.setHours(v.h, v.m, 0, 0);
    if (w > date) w.setDate(w.getDate() - 1);
    return Math.round((date - w) / 60000);
  }
  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30) || "anon"; }

  function fmtDur(min) { return Math.floor(min / 60) + " " + t("hh") + " " + String(min % 60).padStart(2, "0") + " " + t("mm"); }
  function plausibility(wake) {
    const out = [], bed = tpGet("bed"), total = durMin("total"), started = T.startedAt || new Date();
    if (bed) {
      const win = ((wake.h * 60 + wake.m) - (bed.h * 60 + bed.m) + 1440) % 1440;
      if (win < 120 || win > 960) out.push(t("warnWindow", { b: fmtDur(win) }));
      else if (total != null && total > win + 10) out.push(t("warnTotalBed", { a: fmtDur(total), b: fmtDur(win) }));
    }
    const parts = ["deep", "rem", "light"].map(durMin).filter(v => v != null);
    if (total != null && parts.length) { const sum = parts.reduce((a, b) => a + b, 0); if (sum > total + 10) out.push(t("warnStages", { a: fmtDur(sum), b: fmtDur(total) })); }
    const since = minutesSince(wake, started);
    if (since != null && since > 360) out.push(t("warnWakeLate", { a: fmtDur(since) }));
    return out;
  }
  let warnAck = false;
  function hideWarn() { $("warnbox").hidden = true; }
  $("s3").addEventListener("change", (e) => {
    warnAck = false; hideWarn();
    const f = e.target.closest && e.target.closest(".field"); if (f) f.classList.remove("missing");
  });
  $("sl-score").addEventListener("input", () => $("sl-score").closest(".field").classList.remove("missing"));
  $("warn-fix").addEventListener("click", hideWarn);
  $("warn-save").addEventListener("click", () => { warnAck = true; hideWarn(); $("submit").click(); });

  $("submit").addEventListener("click", async () => {
    const err = $("s3-err"); err.hidden = true;
    const required = [
      ["score", "scoreLabel", () => scoreSet, $("sl-score").closest(".field")],
      ...["total", "bed", "wake", "deep", "light", "rem", "awake"].map(k => [k, k + "Label", () => tpGet(k) != null, $("tp-" + k).closest(".field")])
    ];
    const missing = required.filter(r => !r[2]());
    required.forEach(r => r[3].classList.toggle("missing", !r[2]()));
    if (missing.length) {
      hideWarn();
      err.textContent = t("errMissing", { list: missing.map(r => t(r[1])).join(", ") });
      err.hidden = false;
      missing[0][3].scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
      return;
    }
    const wake = tpGet("wake");
    if (!warnAck) {
      const warns = plausibility(wake);
      if (warns.length) {
        const ul = $("warnlist"); ul.innerHTML = "";
        warns.forEach(w => { const li = document.createElement("li"); li.textContent = w; ul.appendChild(li); });
        $("warnbox").hidden = false;
        $("warnbox").scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
        return;
      }
    }
    const btn = $("submit"); btn.disabled = true; btn.textContent = t("saving");

    let profile = {}; try { profile = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) {}
    const anonId = cleanId($("p-id").value) || profile.anonId || "P-UNKNOWN";
    const started = T.startedAt || new Date();
    const id = localDate(started) + "_" + slug(anonId) + "_" + Math.random().toString(36).slice(2, 7);
    const total = tpGet("total");

    const entry = {
      id,
      createdAt: new Date().toISOString(),
      date: localDate(started),
      anonId,
      age: Number($("p-age").value) || profile.age || null,
      language: lang,
      test: {
        startedAt: started.toISOString(),
        trialsRequested: T.n,
        inputMethod: T.inputMethod || null,
        reactionsMs: T.trials.map(x => x.rt),
        waitsMs: T.trials.map(x => x.waitMs),
        practiceMs: T.practice.map(x => x.rt),
        practiceFalseStarts: T.practiceFalseStarts,
        disturbed: $("disturbed").checked,
        ...T.stats
      },
      minutesAfterWaking: minutesSince(wake, started),
      sleep: {
        bedTime: hhmm(tpGet("bed")),
        wakeTime: hhmm(wake),
        sleepScore: scoreSet ? Number($("sl-score").value) : null,
        totalSleepMin: total ? total.h * 60 + total.m : null,
        deepMin: durMin("deep"),
        remMin: durMin("rem"),
        lightMin: durMin("light"),
        awakeMin: durMin("awake")
      },
      client: { userAgent: navigator.userAgent.slice(0, 300), screen: `${screen.width}x${screen.height}`, tzOffsetMin: -new Date().getTimezoneOffset() }
    };


    lastEntry = entry;
    let saved = false, saveErr = "";
    const url = SCRIPT_URL.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
      saveErr = url.includes("PASTE_YOUR") ? "SCRIPT_URL not filled in" : "SCRIPT_URL must start with https://script.google.com/ and end with /exec";
    } else {
      const body = JSON.stringify({ token: TOKEN, entry });
      for (let attempt = 0; attempt < 2 && !saved; attempt++) {
        try {
          const res = await fetch(url, { method: "POST", body });
          const text = await res.text();
          let j = null; try { j = JSON.parse(text); } catch (e) {}
          if (j && j.ok) saved = true;
          else if (j) saveErr = "script answered: " + (j.error || "not ok");
          else saveErr = "HTTP " + res.status + ", no JSON (" + text.slice(0, 60).replace(/\s+/g, " ") + ")";
        } catch (e) {
          saveErr = "no connection or access blocked (" + (e && e.message ? e.message : e) + ")";
          await new Promise(r => setTimeout(r, 1000 + Math.random() * 1000));
        }
      }
    }
    if (!saved) console.error("Wake-up save failed:", saveErr);
    btn.disabled = false; btn.textContent = t("save");
    warnAck = false;
    const h = loadHist();
    if (!entry.test.disturbed && entry.test.medianMs != null) {
      h.entries.push({ date: entry.date, median: entry.test.medianMs });
      h.entries = h.entries.slice(-60);
      if (entry.test.fastestMs != null && (h.bestSingle == null || entry.test.fastestMs < h.bestSingle)) h.bestSingle = entry.test.fastestMs;
      saveHist(h);
    }
    const recent = h.entries.slice(-14);
    if (recent.length) {
      renderBars("hist-chart", recent.map(x => ({ v: x.median, top: Math.round(x.median), label: x.date.slice(8, 10) + "." + x.date.slice(5, 7) + ".", lapse: x.median > LAPSE_MS })), null, t("histTitle"));
      $("hist-wrap").hidden = false;
    } else $("hist-wrap").hidden = true;
    if (saved) {
      $("done-title").textContent = t("savedTitle");
      $("done-text").textContent = t("savedText", { n: entry.test.validResponses, m: entry.test.medianMs ?? "–" });
      $("fallback").hidden = true;
    } else {
      $("done-title").textContent = t("notSavedTitle");
      $("done-text").textContent = t("notSavedText") + (saveErr ? " [" + saveErr + "]" : "");
      $("fallback").hidden = false;
    }
    $("fallback-status").textContent = "";
    setStep(4);
  });

  $("dl-json").addEventListener("click", async () => {
    const st = $("fallback-status");
    try {
      const blob = new Blob([JSON.stringify(lastEntry, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `wakeup_${lastEntry.id}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      st.textContent = t("downloaded"); st.className = "statusline ok";
    } catch (e) { st.textContent = t("dlFail"); st.className = "statusline bad"; }
  });
  $("copy-json").addEventListener("click", async () => {
    const st = $("fallback-status");
    try { await navigator.clipboard.writeText(JSON.stringify(lastEntry)); st.textContent = t("copied"); st.className = "statusline ok"; }
    catch (e) { st.textContent = t("copyFail"); st.className = "statusline bad"; }
  });
  $("again").addEventListener("click", () => {
    ["bed", "wake", "total", "deep", "rem", "light", "awake"].forEach(tpClear);
    warnAck = false; hideWarn();
    scoreSet = false; $("sl-score").value = "50"; updateScore();
    document.querySelectorAll("#s3 .field.missing").forEach(f => f.classList.remove("missing"));
    $("s3-err").hidden = true;
    setStep(1);
  });

  setStep(1);
  applyLang();
})();
</script>

</body>
